<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        :root 
        {
            --main-background: #FFF001;
            --main-foreground: #54C1E6;
            --pane-padding: 5px 42px;
        }

        body 
        {
            background-color: var(--main-background);
            foreground-color: var(--main-foreground);

        }

        .container 
        {
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
        }
    </style>
</head>
    
<body>
    <header>
        <h1>Lab 5</h1>
    </header>
    
    <main>
        <div class="container">
            <img src="Zodd_berserk.jpg">
        </div>
    </main>
    
    <footer>
        <p>Haiden Murphy</p> <this-year></this-year>
    </footer>
  
    <script>
        class ThisYear extends HTMLElement {
            connectedCallback() {
                const currentYear = new Date().getFullYear();
                this.innerHTML = `<p>&copy; ${2077}</p>`;
            }
        }
        customElements.define('this-year', ThisYear);
    </script>
  
</body>
</html>
