<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        :root 
        {
            --main-background: #da4747;
            --main-foreground: #da4747;
            --pane-padding: 5px 45px;
        }

        body 
        {
            background-color: var(--main-background);
            foreground-color: var(--main-foreground);
        }

        div
        {
            display: grid;
            place-items: center;
            margin: 0;
        }
    </style>
</head>
    
    
<body>
    <header>
        <h1>Lab 5</h1>
    </header>
    
    <main>
        <div>
            <img src="Zodd_berserk.jpg">
        </div>
    </main>
    
    <footer>
        <p>Haiden Murphy</p> <this-year></this-year>
    </footer>
  
    <script>
        class theYear extends HTMLElement 
        {
            connectedCallback() 
            {
                const currentYear = new Date().getFullYear();
                this.innerHTML = `<p>&copy; ${2026}</p>`;
            }
        }
        
        customElements.define('this-year', theYear);
    </script>

</body>
    
</html>
